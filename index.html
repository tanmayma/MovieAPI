<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login & Movies</title>
    <link href="style.css" rel="stylesheet">
</head>
<body>
    <!-- login page -->
     <div class="container" id="loginPage">
        <div class="card">
            <h2>Login</h2>
            <input type="email" id="email" placeholder="Eneter email" required>
            <input type="password" id="password" placeholder="Enter password" required>
            <button onclick="login()">Login</button>
            <p id="errorMsg" style="color: red;"></p>
        </div>
     </div>

     <!-- movie page -->
     <div id="moviePage">
        <h1 style="text-align: center;">Movie Search</h1>
        <div style="text-align: center; margin-bottom: 20px;">
            <input type="text" id="searchInput" placeholder="Enter Movie Name">
            <button onclick="searchMovies()">Search</button>
        </div>
        <ul id="movieList">Movies here</ul>
     </div>

     <script>
        const apiKey = "7aa25c8a";

        async function login() {
            const email = document.getElementById("email").value.trim();
            const password = document.getElementById("password").value.trim();
            const errorMsg = document.getElementById("errorMsg");

            try {
                // load users.json

                const res = await fetch("users.json");
                const users = await res.json();

                // check if user exists
                const user = users.find(u => u.email === email && u.password === password)

                if(user) {
                    document.getElementById("loginPage").style.display = "none";
                    document.getElementById("moviePage").style.display = "block";
                } else {
                    errorMsg.textContent = "Invalid email or Password";
                }

            }
            catch(err) {
                console.error("error loading users.json:", err);
            }
        }
            async function searchMovies(){
                const searchTerms = document.getElementById("searchInput").value.trim();
                const apiUrl =`http://www.omdbapi.com/?apikey=${apiKey}&s=${searchTerms}`;

                try {
                    const response = await fetch(apiUrl);
                    const data = await response.json();

                    const movieList = document.getElementById("movieList");
                    movieList.innerHTML = "";

                    if(data.Response === "True") {
                        data.Search.forEach(movie => {
                            const li = document.createElement("li");
                            li.classList.add("movie-card");

                            li.innerHTML = `
                                <img src="${movie.Poster !== "N/A" ? movie.Poster: 'https://via.placeholder.com/200x300?text=No+Image'}" alt="${movie.Title}">
                                <h3 style = "color:red;">${movie.Title}</h3>
                                <p><i>Year: ${movie.Year}</i></p>
                            `;

                            movieList.appendChild(li);
                        });
                    } else {
                        movieList.innerHTML =` <li>No movies found for "${searchTerms}"</li>`;
                    }
                } catch(error) {
                    console.error("Error fetching movies-",error);
                }
            }
     </script>
    
</body>
</html>
